name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build universal binary (arm64 + x86_64)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/ClaudeNotch"
          lipo -info "$BIN"
          mkdir -p dist
          cp "$BIN" dist/ClaudeNotch
          codesign --force --sign - dist/ClaudeNotch
          tar -czf dist/ClaudeNotch-macos.tar.gz -C dist ClaudeNotch

      - name: Smoke test (server answers, quit works)
        run: |
          ./dist/ClaudeNotch &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:7823/health && break; sleep 0.25; done
          curl -sf -X POST -H 'Content-Type: application/json' \
            --data '{"hook_event_name":"UserPromptSubmit","session_id":"ci","cwd":"/tmp"}' \
            http://127.0.0.1:7823/event
          curl -sf -X POST http://127.0.0.1:7823/quit
          sleep 1
          ! pgrep -x ClaudeNotch

      - name: Check npm CLI
        run: |
          node --check bin/claude-notch.js
          node bin/claude-notch.js --version
          npm pack --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeNotch-macos
          path: dist/ClaudeNotch-macos.tar.gz

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          test "v$(node -p 'require("./package.json").version')" = "$TAG" || { echo "package.json version != $TAG"; exit 1; }
          gh release create "$TAG" dist/ClaudeNotch-macos.tar.gz --title "$TAG" --generate-notes

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
